version: '3.8'
services:
  web:
    build: .
    volumes:
      - ./app:/app/app
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/choseisan
    depends_on:
      - db
    expose:
      - '8000'
    restart: always
    command: sh -c "sleep 5 && gunicorn -w 2 -b 0.0.0.0:8000 app.app:app"

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./app/app/static:/app/app/static
    ports:
      - '80:80'
    depends_on:
      - web

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=choseisan
    ports:
      - '5432:5432'